# ─── Configuração de Tema — Design System ─────────────────────────────────────
# Este arquivo define o tema base do Streamlit
# O tema é sobrescrito dinamicamente pelo utils/theme.py

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

# ─── Server ─────────────────────────────────────────────────────────────────────
[server]
headless = true
enableCORS = false
enableXsrfProtection = true

# ─── Browser ────────────────────────────────────────────────────────────────────
[browser]
gatherUsageStats = false
